kind = "web"
previewPath = "/"
title = "REPOGUARD"
version = "1.0.0"
id = "artifacts/repoguard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18733

[services.development]
run = "pnpm --filter @workspace/repoguard run dev"

[services.production]
build = [ "sh", "-c", "pnpm --filter @workspace/repoguard run build && pip install -r backend/requirements.txt" ]
run = [ "sh", "-c", "cd backend && python run.py" ]

[services.env]
PORT = "18733"
BASE_PATH = "/"
