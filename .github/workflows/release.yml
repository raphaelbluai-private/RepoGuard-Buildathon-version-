name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend-ci:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/repoguard/dist/
          retention-days: 1

  backend-ci:
    name: Backend — Production Regression, x402 & Discovery Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Compile production modules
        run: uv run python -m py_compile backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py backend/x402_payments.py backend/commerce_telemetry.py
      - name: Lint correctness-critical rules
        run: uv run ruff check --select E4,E7,E9,F backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py backend/x402_payments.py backend/commerce_telemetry.py
      - name: Run regression, API, x402, discovery and telemetry tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-release-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-release-commerce.sqlite3
        run: uv run pytest -q tests

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Extract changelog for this release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          NOTES=$(awk "/^## ${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="See CHANGELOG.md for details."; fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend/
      - name: Package frontend dist
        run: |
          cd dist/frontend
          zip -r "../../repoguard-frontend-${{ steps.version.outputs.value }}.zip" .
      - name: Package backend
        run: |
          zip -r "repoguard-backend-${{ steps.version.outputs.value }}.zip" \
            backend/ pyproject.toml uv.lock \
            --exclude "backend/__pycache__/*" \
            --exclude "backend/*.pyc" \
            --exclude "backend/*.sqlite3" \
            --exclude "backend/*.sqlite3-wal" \
            --exclude "backend/*.sqlite3-shm"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "REPOGUARD ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            repoguard-frontend-${{ steps.version.outputs.value }}.zip
            repoguard-backend-${{ steps.version.outputs.value }}.zip
