name: CI

on:
  push:
    branches: [demo, x402-production, main, master]
  pull_request:
    branches: [demo, x402-production, main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Type Check, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh dependencies for controlled lock repair
        run: pnpm install --no-frozen-lockfile
      - name: Preserve regenerated pnpm lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Require regenerated lock to be committed
        run: git diff --exit-code -- pnpm-lock.yaml

  backend:
    name: Backend — Security, Regression, Contract & x402 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Refresh Python lock for controlled lock repair
        run: uv sync --group dev
      - name: Preserve regenerated uv lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-uv-lock
          path: uv.lock
          retention-days: 1
      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file /tmp/repoguard-production-requirements.txt
      - name: Audit locked Python dependencies
        run: uvx pip-audit==2.10.1 -r /tmp/repoguard-production-requirements.txt --no-deps
      - name: Compile production modules
        run: >-
          uv run python -m py_compile
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
          backend/payment_operations.py
      - name: Lint correctness-critical rules
        run: >-
          uv run ruff check --select E4,E7,E9,F
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
          backend/payment_operations.py
      - name: Run scanner, API, x402, discovery, telemetry, security and payment-operations suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-ci-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-ci-commerce.sqlite3
          REPOGUARD_PAYMENT_DB: /tmp/repoguard-ci-payments.sqlite3
        run: uv run pytest -q tests
      - name: Require regenerated lock to be committed
        run: git diff --exit-code -- uv.lock

  container:
    name: Production Container — Build Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag repoguard-ci:${{ github.sha }} .
