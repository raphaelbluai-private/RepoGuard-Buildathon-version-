name: CI

on:
  push:
    branches: [x402-production]
  pull_request:
    branches: [x402-production]

permissions:
  contents: read

jobs:
  security:
    name: Dependency and secret-pattern gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - name: Audit Python dependencies
        run: uvx pip-audit --locked .
      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Reject committed private-key material
        run: >-
          ! git grep -nE
          'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}'
          -- ':!.github/workflows/ci.yml' ':!backend/tests'

  frontend:
    name: Frontend — Type Check, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  backend:
    name: Backend — Security, Regression, Contract & x402 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file /tmp/repoguard-production-requirements.txt
      - name: Audit locked Python dependencies
        run: uvx pip-audit==2.10.1 -r /tmp/repoguard-production-requirements.txt --no-deps
      - name: Compile production modules
        run: >-
          uv run python -m py_compile
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/network_policy.py
          backend/production_surface.py
          backend/scan_cache.py
          backend/security_middleware.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
      - name: Lint correctness-critical rules
        run: >-
          uv run ruff check --select E4,E7,E9,F
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/network_policy.py
          backend/production_surface.py
          backend/scan_cache.py
          backend/security_middleware.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
      - name: Run scanner, API, x402, discovery, telemetry and security suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-ci-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-ci-commerce.sqlite3
        run: uv run pytest -q tests

  container:
    name: Production Container — Build Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag repoguard-ci:${{ github.sha }} .
