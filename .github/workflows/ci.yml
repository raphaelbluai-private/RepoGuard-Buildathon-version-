name: CI

on:
  push:
    branches: [demo, x402-production, main, master]
  pull_request:
    branches: [demo, x402-production, main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  backend:
    name: Backend — Regression, Contract, x402 & Discovery Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Compile production modules
        run: uv run python -m py_compile backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py backend/x402_payments.py backend/commerce_telemetry.py
      - name: Lint correctness-critical rules
        run: uv run ruff check --select E4,E7,E9,F backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py backend/x402_payments.py backend/commerce_telemetry.py
      - name: Run scanner, API, x402, discovery and telemetry suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-ci-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-ci-commerce.sqlite3
        run: uv run pytest -q tests

  container:
    name: Production Container — Build Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag repoguard-ci:${{ github.sha }} .
