name: CI

on:
  push:
    branches: [demo, x402-production, main, master]
  pull_request:
    branches: [demo, x402-production, main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  backend:
    name: Backend — Regression, Contract & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Compile production modules
        run: uv run python -m py_compile backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py
      - name: Lint production backend
        run: uv run ruff check backend/app.py backend/run.py backend/scanner.py backend/commercial.py backend/commercial_app.py
      - name: Run scanner and API regression suite
        working-directory: backend
        env:
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-ci-cache.sqlite3
        run: uv run pytest -q tests
