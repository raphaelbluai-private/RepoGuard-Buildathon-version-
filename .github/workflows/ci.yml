name: CI

on:
  push:
    branches: [demo, x402-production, main, master]
  pull_request:
    branches: [demo, x402-production, main, master]

permissions:
  contents: read

concurrency:
  group: repoguard-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — Type Check, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  backend:
    name: Backend — Security, Regression, Contract & Payment Operations Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies from committed lock
        run: uv sync --group dev --frozen
      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file /tmp/repoguard-production-requirements.txt
      - name: Audit locked Python dependencies
        run: uvx pip-audit==2.10.1 -r /tmp/repoguard-production-requirements.txt --no-deps
      - name: Compile production modules
        run: >-
          uv run python -m py_compile
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
          backend/payment_operations.py
          backend/facilitator_assurance.py
          backend/release_identity.py
          backend/persistent_scan_cache.py
          backend/runtime_identity.py
          backend/operational_alerts.py
          backend/performance_budgets.py
          backend/release_assurance.py
          backend/operational_readiness.py
          backend/release_assurance.py
      - name: Lint correctness-critical rules
        run: >-
          uv run ruff check --select E4,E7,E9,F
          backend/app.py
          backend/run.py
          backend/scanner.py
          backend/provider_scanner.py
          backend/source_adapters.py
          backend/provider_credentials.py
          backend/launch_security.py
          backend/commercial.py
          backend/commercial_app.py
          backend/commerce_app_v2.py
          backend/commerce_contracts.py
          backend/product_catalog.py
          backend/provenance.py
          backend/x402_payments.py
          backend/commerce_telemetry.py
          backend/payment_operations.py
          backend/facilitator_assurance.py
          backend/persistent_scan_cache.py
          backend/runtime_identity.py
          backend/operational_alerts.py
          backend/performance_budgets.py
      - name: Run scanner, API, x402, security and payment-operations suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-ci-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-ci-commerce.sqlite3
          REPOGUARD_PAYMENT_DB: /tmp/repoguard-ci-payments.sqlite3
        run: uv run pytest -q tests

  hostile-staging:
    name: Hostile Staging — Non-Live Security Acceptance
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies from committed lock
        run: uv sync --group dev --frozen
      - name: Run adversarial acceptance suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPOGUARD_INTERNAL: "1"
          REPOGUARD_CACHE_DB: /tmp/repoguard-hostile-cache.sqlite3
          REPOGUARD_TELEMETRY_DB: /tmp/repoguard-hostile-commerce.sqlite3
          REPOGUARD_PAYMENT_DB: /tmp/repoguard-hostile-payments.sqlite3
        run: |
          mkdir -p ../build/release-evidence
          uv run pytest -q tests/test_hostile_staging.py --junitxml=../build/release-evidence/hostile-staging-junit.xml
      - name: Write hostile staging gate report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path("build/release-evidence")
          report = {
              "schema": "repoguard.hostile-staging-report.v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "payment_network_used": False,
              "scope": [
                  "malicious_provider_host",
                  "private_metadata_ssrf",
                  "redirect_destination_change",
                  "credential_exfiltration",
                  "oversized_request",
                  "concurrent_overload",
                  "secret_log_redaction",
                  "payment_proof_replay_simulation",
              ],
              "status": "PASS",
              "live_payment_replay_acceptance_required": True,
          }
          (out / "hostile-staging-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repoguard-hostile-staging-${{ github.sha }}
          path: build/release-evidence/hostile-staging-*
          retention-days: 30

  container:
    name: Production Container — Build & Vulnerability Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, hostile-staging]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg REPOGUARD_BUILD_SHA=${{ github.sha }} --tag repoguard-ci:${{ github.sha }} .
      - name: Verify embedded source revision
        run: |
          test "$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' repoguard-ci:${{ github.sha }})" = "${{ github.sha }}"
      - name: Scan production image for HIGH/CRITICAL vulnerabilities
        run: |
          mkdir -p build/release-evidence
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "${{ github.workspace }}/build/release-evidence:/evidence"             aquasec/trivy:0.58.2 image             --exit-code 1             --ignore-unfixed             --severity HIGH,CRITICAL             --format json             --output /evidence/container-vulnerability-report.json             repoguard-ci:${{ github.sha }}
      - name: Capture container provenance
        run: |
          mkdir -p build/release-evidence
          docker image inspect repoguard-ci:${{ github.sha }} > build/release-evidence/container-image-inspect.json
          docker image inspect --format='{{.Id}}' repoguard-ci:${{ github.sha }} > build/release-evidence/container-image-id.txt
      - name: Upload container provenance
        uses: actions/upload-artifact@v4
        with:
          name: repoguard-container-provenance-${{ github.sha }}
          path: build/release-evidence/
          retention-days: 30

  release-evidence:
    name: Release Evidence — Manifest & Dependency Inventory
    runs-on: ubuntu-latest
    needs: [frontend, backend, hostile-staging, container]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install from committed locks
        run: |
          pnpm install --frozen-lockfile
          uv sync --group dev --frozen
      - name: Generate exact-SHA release manifest
        run: uv run python scripts/generate_release_evidence.py
      - name: Generate release readiness evidence
        run: uv run python scripts/generate_release_readiness.py
      - name: Generate branch/repository release assurance evidence
        env:
          REPOGUARD_RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REPOGUARD_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: uv run python scripts/generate_release_assurance.py
      - name: Generate machine-readable dependency inventories
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file build/release-evidence/python-production-requirements.txt
          pnpm list --json --prod --depth Infinity > build/release-evidence/node-production-dependencies.json
      - name: Verify manifest identity
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path("build/release-evidence/release-manifest.json").read_text())
          assert p["source_commit"] == os.environ["GITHUB_SHA"]
          assert p["dirty"] is False
          assert p["runtime_identity_required_for_authorized_release"] is True
          readiness = json.loads(Path("build/release-evidence/release-readiness-evidence.json").read_text())
          assert readiness["source_commit"] == os.environ["GITHUB_SHA"]
          assert readiness["engineering_evidence_current"] is True
          assert readiness["release_authorized"] is False
          assert "live_base_sepolia_acceptance" in readiness["live_blockers"]
          assurance = json.loads(Path("build/release-evidence/release-assurance.json").read_text())
          assert assurance["branch"] == "x402-production"
          assert assurance["source_sha"] == os.environ["GITHUB_SHA"]
          assert assurance["release_authorized"] is False
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: repoguard-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          retention-days: 30
