name: Controlled Lock Repair

on:
  push:
    branches: [x402-production]

permissions:
  contents: write

jobs:
  repair-locks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/x402-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x402-production
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Regenerate exact lockfiles
        run: |
          pnpm install --no-frozen-lockfile
          uv lock
      - name: Commit only regenerated locks
        run: |
          if git diff --quiet -- pnpm-lock.yaml uv.lock; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "RepoGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml uv.lock
          git commit -m "chore(ci): refresh security dependency lockfiles [skip ci]"
          git push origin HEAD:x402-production
