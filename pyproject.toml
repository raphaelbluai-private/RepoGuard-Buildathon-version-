[project]
name = "repoguard"
version = "1.0.0"
description = "Deterministic repository safe-to-ship scanner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "anyio>=4.14.2",
    "idna>=3.15",
    "starlette>=1.3.1",
    "pydantic>=2.12.5",
    "requests>=2.32.0",
    "uvicorn>=0.44.0",
    "x402[evm,extensions,fastapi]==2.22.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
